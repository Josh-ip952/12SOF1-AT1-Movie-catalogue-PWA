<!DOCTYPE html>
<link href="../static/css/style.css" rel="stylesheet">

<html>

<head>
    <title>Catalogue Page</title>
</head>

<body>
    <!--
    The following Navigation bar is inspired in this video:
    https://www.youtube.com/watch?v=-Yw9gBHE60E Accessed 30/10/2026
-->
    <nav class="navbar">`
        <div class="banner">
            <div class="logo"><a href="#">Movie Catalogue</a></div>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="catalogue.html">Catalogue</a></li>
                <li><a href="movie details.html">Movie Details</a></li>
            </ul>
        </div>
    </nav>

    <div class="query-bar">

        <h4>Sort By:</h4>
        <h4>Year</h4>
        <form method="POST">
            <select class="filter" name="year" onchange="this.form.submit()">
                <option value="All_year">All year</option>
                <option value="1961-1970">1961-1970</option>
                <option value="1971-1980">1971-1980</option>
                <option value="1981-1990">1981-1990</option>
                <option value="1991-2000">1991-2000</option>
                <option value="2001-2010">2001-2010</option>
                <option value="2011-2020">2011-2020</option>
                <option value="2021-2030">2021-2030</option>
            </select>
        </form>
        
        <h4>Rating</h4>
        <form method="POST">
            <select class="filter" name="rating" onchange="this.form.submit()">
                <option value="Best_to_worst">Best to worst</option>
                <option value="Worst_to_best">Worst to best</option>
            </select>
        </form>

        <form method="POST">
            <input type="text" placeholder="Search..">
            <!-- NEED TO DEVELOP TO SEND REQUEST-->
        </form>

    </div>

    <div class="movie-catalogue">
        {% for movie in movies %}
        <div class="movie-card">
            <h3>{{movie[1]}}</h3>
            <h3>Year: {{movie[2]}}</h3>
            <h3>Rating: {{movie[3]}}</h3>
        </div>
        {% endfor %}

    </div>


</body>



</html>
